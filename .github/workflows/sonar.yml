name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
      - development
  pull_request:
    branches:
      - main
      - master
      - development

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4   # ✅ updated
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=jitendar2580_attendance-ai
            -Dsonar.organization=jitendar2580
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}