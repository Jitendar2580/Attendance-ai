{% extends "base.html" %}
{% block content %}
<div class="page-header reveal">
  <h1>Teams</h1>
  <p>Organize squads and assign players for scoped reporting.</p>
</div>

<div class="card app-card mb-4 reveal">
  <div class="card-header-soft"><i class="bi bi-diagram-3"></i> New team</div>
  <div class="card-body-pad">
    <form class="row g-3 align-items-end" method="post" action="/teams/create">
      <div class="col-md-10">
        <label class="form-label small text-muted mb-1">Team name</label>
        <input class="form-control form-control-lg" name="name" placeholder="e.g. Alpha Squad" required>
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg me-1"></i> Create</button>
      </div>
    </form>
  </div>
</div>

<div class="card app-card reveal">
  <div class="card-header-soft"><i class="bi bi-collection"></i> All teams</div>
  <div class="table-responsive">
    <table class="table data-table align-middle mb-0">
      <thead><tr><th>ID</th><th>Name</th><th class="text-end">Actions</th></tr></thead>
      <tbody>
        {% for team in teams %}
        <tr class="hover-row">
          <td class="text-muted font-monospace small">#{{ team.id }}</td>
          <td class="fw-semibold">{{ team.name }}</td>
          <td class="text-end">
            <form class="d-inline" method="post" action="/teams/{{ team.id }}/delete" onsubmit="return confirm('Delete this team?');">
              <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill"><i class="bi bi-trash"></i> Delete</button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="text-center text-muted py-5">No teams yet — create one above.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
