<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Attendance IQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
  <style>
    .login-page { min-height: 100vh; display: flex; align-items: stretch; font-family: "Plus Jakarta Sans", sans-serif; }
    .login-visual {
      flex: 1.1;
      background: linear-gradient(145deg, #1e1b4b 0%, #4f46e5 50%, #7c3aed 100%);
      color: #fff;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .login-visual::before {
      content: "";
      position: absolute;
      width: 400px; height: 400px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      top: -100px; right: -80px;
    }
    .login-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; background: #f0f4f9; }
    .login-card { max-width: 420px; width: 100%; border-radius: 22px; border: 1px solid rgba(15,23,42,0.08); box-shadow: 0 24px 60px rgba(15,23,42,0.08); }
    .login-logo { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 1.25rem; }
    @media (max-width: 991px) { .login-visual { display: none; } }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-visual">
      <div class="mb-4" style="position: relative; z-index: 1;">
        <span class="badge rounded-pill px-3 py-2" style="background: rgba(255,255,255,0.2); font-weight: 600;">Attendance IQ</span>
      </div>
      <h1 class="fw-bold display-6 mb-3" style="position: relative; z-index: 1;">Turn attendance into<br>performance insight.</h1>
      <p class="mb-0 opacity-75" style="max-width: 420px; position: relative; z-index: 1;">AI summaries, trends, and team health — in one calm dashboard.</p>
      <div class="mt-5 d-flex gap-3 flex-wrap" style="position: relative; z-index: 1;">
        <span class="small opacity-75"><i class="bi bi-shield-check me-1"></i> Role-based access</span>
        <span class="small opacity-75"><i class="bi bi-graph-up me-1"></i> Live analytics</span>
      </div>
    </div>
    <div class="login-panel">
      <div class="card login-card">
        <div class="card-body p-4 p-md-5">
          <div class="login-logo text-white"><i class="bi bi-graph-up-arrow"></i></div>
          <h2 class="fw-bold h4 mb-1">Welcome back</h2>
          <p class="text-muted small mb-4">Sign in to manage attendance and insights.</p>
          {% if error %}
          <div class="alert alert-danger border-0 rounded-3 py-2 small">{{ error }}</div>
          {% endif %}
          <form method="post" action="/auth/login">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-muted">Email</label>
              <input class="form-control form-control-lg" type="email" name="email" placeholder="you@company.com" required autocomplete="email">
            </div>
            <div class="mb-4">
              <label class="form-label small fw-semibold text-muted">Password</label>
              <input class="form-control form-control-lg" type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button class="btn btn-primary btn-lg w-100 py-2 rounded-3" type="submit">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
            </button>
          </form>
          <div class="text-center mt-4">
            <span class="small text-muted">New here?</span>
            <a href="/auth/register" class="text-primary fw-semibold">Create an account</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
